<!DOCTYPE html>
<html>
<head>
    <title>Parent / Student Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('backgroud_image.jpg') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            background-color: #491976;
            color: white;
            padding: 10px;
            margin: 0;
        }

        .container, .dashboard {
            width: 575px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 1px 1px 5px rgba(0,0,0,0.3);
            background: #195876;
            color: white;
        }

        .dashboard { display: none; }

        input {
            margin: 5px 0;
            padding: 10px;
            width: 90%;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background: #491976;
            color: white;
        }

        a { color: #ffddff; text-decoration: none; }

        .info {
            background: #ffffffcc;
            color: black;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #555;
            padding: 5px;
            text-align: left;
        }

        th {
            background: #491976;
            color: white;
        }
    </style>
</head>

<body>

<h1>Parent / Student Portal</h1>

<p>Please log in to access your account.</p>

<!-- LOGIN -->
<div class="container" id="loginContainer">
    <h2>Login</h2>

    <label>Username</label><br>
    <input type="text" id="username"><br><br>

    <label>Password</label><br>
    <input type="password" id="password"><br><br>

    <button onclick="login()">Login</button>

    <p><a href="#" onclick="showForgot()">Forgot Password?</a></p>
</div>

<!-- FORGOT PASSWORD -->
<div class="container" id="forgotContainer" style="display:none;">
    <h2>Forgot Password</h2>

    <label>Enter Username</label><br>
    <input type="text" id="forgotUsername"><br><br>

    <button onclick="sendOTP()">Send OTP</button><br><br>
    <a href="#" onclick="backToLogin()">Back to Login</a>
</div>

<!-- OTP -->
<div class="container" id="otpContainer" style="display:none;">
    <h2>OTP Verification</h2>

    <label>Enter OTP</label><br>
    <input type="text" id="otpInput"><br><br>

    <button onclick="verifyOTP()">Verify OTP</button>
</div>

<!-- RESET PASSWORD -->
<div class="container" id="resetContainer" style="display:none;">
    <h2>Reset Password</h2>

    <label>New Password</label><br>
    <input type="password" id="newPassword"><br><br>

    <label>Confirm Password</label><br>
    <input type="password" id="confirmPassword"><br><br>

    <button onclick="resetPassword()">Update Password</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <h2 id="dashboardTitle"></h2>
    <div id="dashboardContent" class="info"></div>
    <button onclick="logout()">Logout</button>
</div>

<script>
let generatedOTP = "";
let resetUser = null;

const accounts = [
    { 
      username: "Kishore Babu Pavuluri", 
      password: "Parent123!", 
      role: "Parent",
      child: { 
          name: "Mokshith Pavuluri", 
          dob: "2012-05-15", 
          grade: "8th",
          grades: {
              Math: "A+",
              Science: "A",
              English: "A+"
          }
      } 
    },

    { 
      username: "student_Mokshith 123!", 
      password: "Mokshith 123!", 
      role: "Student",
      dob: "2012-05-15",
      grade: "6th",
      grades: {
          Math: "A+",
          Science: "A",
          English: "A+"
      }
    },

    { 
      username: "admin_master", 
      password: "Admin@999", 
      role: "Admin" 
    }
];

function login() {
    const acc = accounts.find(
        a => a.username === username.value && a.password === password.value
    );
    if (!acc) return alert("Invalid username or password");

    loginContainer.style.display = "none";
    dashboard.style.display = "block";
    dashboardTitle.innerText = acc.role + " Dashboard";

    if (acc.role === "Parent") {
        const c = acc.child;

        let gradesHTML = "";
        for (let subject in c.grades) {
            gradesHTML += `<tr><td>${subject}</td><td>${c.grades[subject]}</td></tr>`;
        }

        dashboardContent.innerHTML = `
            <h3>Child Information</h3>
            <p><b>Name:</b> ${c.name}</p>
            <p><b>Date of Birth:</b> ${c.dob}</p>
            <p><b>Grade:</b> ${c.grade}</p>

            <h3>Grades</h3>
            <table>
                <tr><th>Subject</th><th>Grade</th></tr>
                ${gradesHTML}
            </table>
        `;
    }

    else if (acc.role === "Student") {

        let gradesHTML = "";
        for (let subject in acc.grades) {
            gradesHTML += `<tr><td>${subject}</td><td>${acc.grades[subject]}</td></tr>`;
        }

        dashboardContent.innerHTML = `
            <h3>Student Information</h3>
            <p><b>Date of Birth:</b> ${acc.dob}</p>
            <p><b>Grade:</b> ${acc.grade}</p>

            <h3>Grades</h3>
            <table>
                <tr><th>Subject</th><th>Grade</th></tr>
                ${gradesHTML}
            </table>
        `;
    }

    else if (acc.role === "Admin") {
        dashboardContent.innerHTML = "<p>Admin Access Granted</p>";
    }
}

function logout() {
    dashboard.style.display = "none";
    loginContainer.style.display = "block";
}

function showForgot() {
    loginContainer.style.display = "none";
    forgotContainer.style.display = "block";
}

function backToLogin() {
    forgotContainer.style.display = "none";
    otpContainer.style.display = "none";
    resetContainer.style.display = "none";
    loginContainer.style.display = "block";
}

function sendOTP() {
    resetUser = accounts.find(a => a.username === forgotUsername.value);
    if (!resetUser) return alert("Username not found");

    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
    alert("Your OTP is: " + generatedOTP); // Demo only

    forgotContainer.style.display = "none";
    otpContainer.style.display = "block";
}

function verifyOTP() {
    if (otpInput.value !== generatedOTP)
        return alert("Invalid OTP");

    otpContainer.style.display = "none";
    resetContainer.style.display = "block";
}

function resetPassword() {
    if (newPassword.value !== confirmPassword.value)
        return alert("Passwords do not match");

    resetUser.password = newPassword.value; // Demo update
    alert("Password updated successfully!");

    resetContainer.style.display = "none";
    loginContainer.style.display = "block";
}
</script>

</body>
</html>
